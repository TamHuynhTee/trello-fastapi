[commit]
conventional_commits = true
subject_imperative = true
subject_max_length = 100

allow_commit_types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "perf",
  "test",
  "build",
  "ci",
  "chore",
  "revert",
]

allow_merge_commits = true
allow_wip_commits = false
require_signed_off_by = false

ignore_authors = [
  "dependabot[bot]",
  "renovate[bot]",
]