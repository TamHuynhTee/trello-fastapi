[project]
name = "trello-clone"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "commit-check>=2.16.0",
    "httpx2>=2.12.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",    # Import and whitespace errors
    "E7",    # Statement errors
    "E9",    # Syntax/runtime errors
    "F",     # Pyflakes
    "I",     # Arrange import
    "UP",    # Upgrade Python syntax
    "B",     # Bugbear
    "SIM",   # Code simplification
    "ASYNC", # Async errors
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Preserve the existing str + Enum model convention; StrEnum changes str(member).
"app/models/*.py" = ["UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
